name: Track incursions and deploy Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: "2-57/5 * * * *"
  workflow_dispatch:

concurrency:
  group: eve-incursion-pages
  cancel-in-progress: true

jobs:
  update-state:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.changes.outputs.changed }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: main

      - name: Poll EVE ESI
        run: python scripts/update_incursion_state.py

      - name: Check for lifecycle changes
        id: changes
        shell: bash
        run: |
          if git diff --quiet -- data/incursion-state.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Save lifecycle changes
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            python scripts/update_incursion_state.py

            if git diff --quiet -- data/incursion-state.json; then
              echo "The latest main branch already contains this state."
              exit 0
            fi

            git add data/incursion-state.json
            git commit -m "Update incursion state"
            if git push origin HEAD:main; then
              exit 0
            fi

            echo "Main changed while saving; retrying from the latest commit ($attempt/3)."
          done

          echo "Could not save incursion state after three attempts."
          exit 1

  deploy:
    needs: update-state
    if: github.event_name != 'schedule' || needs.update-state.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the latest site
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Prepare the static site
        shell: bash
        run: |
          mkdir _site
          cp index.html styles.css app.js system-types.js station-systems.js system-security.js _site/
          mkdir _site/data
          cp data/incursion-state.json _site/data/
          touch _site/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload the Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Depoy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
